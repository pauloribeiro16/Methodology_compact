# ============================================================
# TENSIONS (Strategic conflicts between clauses)
# ============================================================

tensions:
  - id: "T-001"
    type: "timing"
    severity: "high"
    clause_1: "GDPR-C25"
    clause_2: "CRA-C20"
    description: "Breach notification timing mismatch"
    details: |
      GDPR requires 72-hour notification to supervisory authority after becoming aware of a personal data breach.
      CRA requires 24-hour notification to ENISA after becoming aware of a significant incident.
    
    affected_subdomains: ["D-04.3"]
    affected_regulations: ["GDPR", "CRA"]
    
    resolution:
      approach: "max_sla_routing"
      description: "Use the most stringent timeline (24h) as the internal standard for all breach notifications"
      implementation: "Single incident response workflow that satisfies both requirements"

  - id: "T-002"
    type: "scope"
    severity: "medium"
    clause_1: "GDPR-C21"
    clause_2: "CRA-C07"
    description: "Processor vs Manufacturer obligations"
    details: |
      GDPR Art. 28 requires processor clauses in contracts with downstream processors.
      CRA Art. 7 requires supply chain security assessments.
    
    affected_subdomains: ["D-06.1", "D-06.3"]
    affected_regulations: ["GDPR", "CRA"]
    
    resolution:
      approach: "unified_vendor_management"
      description: "Single vendor risk assessment template that addresses both GDPR Art. 28 and CRA Art. 7 requirements"
      implementation: "Enhanced vendor due diligence process"

  - id: "T-003"
    type: "requirement"
    severity: "medium"
    clause_1: "GDPR-C13"
    clause_2: "CRA-C13"
    description: "Records documentation overlap"
    details: |
      GDPR Art. 30 requires records of processing activities.
      CRA Art. 13 requires technical documentation for products.
    
    affected_subdomains: ["D-09.4", "D-09.1"]
    affected_regulations: ["GDPR", "CRA"]
    
    resolution:
      approach: "integrated_documentation"
      description: "Maintain unified records system that satisfies both record-keeping requirements"
      implementation: "Single documentation repository with compliance mappings"

  - id: "T-004"
    type: "intensity"
    severity: "low"
    clause_1: "GDPR-C28"
    clause_2: "CRA-C21"
    description: "DPO vs Security team competence"
    details: |
      GDPR requires DPO with data protection competence.
      CRA requires security team with product security competence.
    
    affected_subdomains: ["D-08.2"]
    affected_regulations: ["GDPR", "CRA"]
    
    resolution:
      approach: "competency_matrix"
      description: "Define competency requirements that address both data protection and product security"
      implementation: "Training matrix covering GDPR and CRA requirements"

