# AEGIS Phase 2 Case Ontology — Case_03_OmniBank_Financial
# Machine-readable representation of Phase 2 obligation derivation, operational
# objectives, rules catalog, strategic tensions, and framework mappings.
# Schema: mirror of Case_01 phase2_ontology.yaml v1.0 (phase1_schema.yaml v1.6 lineage)
#
# v1.0 (2026-09-04) — INITIAL RELEASE for Phase 2 dashboard parity
#   (campaign PORT-PARITY-2, block F4; ports Case_01's content wave of
#   2026-08-31, commit 7be0b3b):
#   - 7 entity classes (Obligation, PrivacyOperationalObjective,
#     SecurityOperationalObjective, ComplianceRule, BestPracticeRule,
#     Tension, NistSubcategory).
#   - 6 relations (OBLIGATES_TO, GENERATES, YIELDS, MITIGATES, MAPS_TO,
#     IN_TENSION_WITH).
#   - Count invariants are the MECHANICAL canonical counts of the Case_03
#     Rich corpus (2026-09-04): obligations=38, tensions=5, po=12, so=26,
#     cr=38, bpr=40, controls=78, source_clauses=150, applicable_regs=5.
#   - Case_03 naming notes (kept as-is, mechanical counting wins over the
#     docs' own summaries; discrepancies flagged as graph audits):
#     * Objectives use the AG- id space (Doc17 tables cite AG-D-XX.Y-NNN;
#       traceability chain Rule → AG → OBL → clauses). PO/SO class is decided
#       by catalog section: §3 PRIVACY (12 canonical rows; the §3.5 summary
#       claims 11 — AUD-P2-007) vs §4 SECURITY (38 unique rows, 12 of which
#       repeat the §3 privacy set → 26 security-only; the §4 summary claims
#       22 — AUD-P2-008).
#     * Tensions: Doc16 cards use TENSION-{H,M,L}-NNN ids; the §4.1 note
#       declares the canonical case set as T-001..T-005 (5 tensions, matching
#       phase1_ontology v2.1-port@case_invariants.tensions). T-005
#       (TENSION-M-002, DORA TLPT) analysis lives in P1 Doc11 §4.5 — AUD-P2-009.
#   - Sources: control_set.yaml (P2 ROOT — canonical; Doc19 port,
#     machine-readable), Doc15, Doc16, Doc17, Doc19, Doc20.

header:
  case_id: "Case_03_OmniBank_Financial"
  phase: 2
  version: "1.0"
  generated_from:
    - "Doc15_Obligation_Derivation.md"      # 38 obligations (canonical tables)
    - "Doc16_Strategic_Tensions_Report.md"  # 4 tension cards + §4.1 note declaring canonical set T-001..T-005
    - "Doc17_Privacy_Security_Objectives.md" # §3 privacy AG rows + §4 security AG rows (AG- id space)
    - "Doc18_Privacy_Security_Goals_NIST_Implications.md"
    - "Doc19_Rules_Catalog.md"              # 78 controls (38 CR + 40 BPR)
    - "Doc20_Framework_Mapping_Matrix.md"
    - "control_set.yaml"                    # Doc19 port, machine-readable (P2 ROOT canonical)
  generated_date: "2026-09-04"
  author: "AEGIS Implementation (v1.0 — Phase 2 dashboard parity, PORT-PARITY-2 F4)"
  sibling_of: "../01_PHASE1_CONTEXT_RICH/phase1_ontology.yaml"

# ============================================================
# COMPANY (carried over from Phase 1 for graph linkage)
# ============================================================
company:
  id: "CC-OMNIBANK-2026-001"
  name: "OmniBank Financial Systems S.A."
  phase1_ontology_ref: "../01_PHASE1_CONTEXT_RICH/phase1_ontology.yaml@company"

# ============================================================
# kg_ontology — formal class/relation/invariants schema
# ============================================================
kg_ontology:

  meta:
    purpose: >
      Formalise the Phase 2 knowledge graph's class/relation/invariants
      schema, so that data/phase2_graph.json and downstream Folio VIII
      (Security Posture) can be validated against a canonical schema.
    sources:
      A_class_model: "00_METHODOLOGY/diagrams/Class_Models/phase1_contextual_definition.md"
      B_phase2_yaml: "02_PHASE2_RULES_RICH/phase2_ontology.yaml"
      C_phase1_yaml: "01_PHASE1_CONTEXT_RICH/phase1_ontology.yaml"
    schema_version: 1.0
    generated: "2026-09-04"

  classes:

    Obligation:
      attrs:
        id: String  # OBL-D-XX.Y-NNN
        subdomain_id: String  # D-XX.Y
        source_clause_ids: List<String>  # GDPR-CNN / CRA-NNN / NIS2-CNN / DORA-CNN / AI-CNN
        title: String
        description: String
        normative_intensity: Float  # 1.0..3.0
        priority: enum(Priority)
        verification_method: String
        owner: String
        risks_if_not_met: String
      source: "Doc15 canonical obligation tables (38 rows: id | title | clauses | D-XX.Y | NI | cadence | obligated parties)"
      example: "OBL-D-01.1-001"

    PrivacyOperationalObjective:
      attrs:
        id: String  # AG-D-XX.Y-NNN (Case_03 objective id space; privacy class = Doc17 §3 rows)
        subdomain_id: String
        title: String
        description: String
        derives_from_obligation_id: String  # OBL-D-XX.Y-NNN (Doc17 §3 source-obligations column)
        nist_csf_anchors: List<String>
        nist_pf_anchors: List<String>
        priority: enum(Priority)
        verification_method: String
      source: "Doc17 §3 PRIVACY OBJECTIVES CATALOG canonical table rows (12 unique AG ids)"
      example: "AG-D-01.1-001"

    SecurityOperationalObjective:
      attrs:
        id: String  # AG-D-XX.Y-NNN (security class = Doc17 §4 rows not already in §3)
        subdomain_id: String
        title: String
        description: String
        derives_from_obligation_id: String  # OBL-D-XX.Y-NNN (Doc17 §4 source-obligations column)
        nist_csf_anchors: List<String>
        nist_pf_anchors: List<String>
        priority: enum(Priority)
        verification_method: String
      source: "Doc17 §4 SECURITY OBJECTIVES CATALOG canonical table rows (38 unique AG ids, 12 shared with §3 → 26 security-only)"
      example: "AG-D-02.1-002"

    ComplianceRule:
      attrs:
        id: String  # CR-D-XX.Y-NNN
        subdomain_id: String
        title: String  # control_set@description
        register: enum(OBLIGATION)
        normative_intensity: Float
        bucket: enum(Priority)
        legal: List<String>  # control_set@source
        phase1_goal_id: String  # AG-D-XX.Y-NNN (control_set@related_goals)
        obligations_addressed: List<String>  # derived via AG chain (control_set@related_goals → Doc17 AG@source obligations)
        objectives_addressed: List<String>  # AG ids from control_set@related_goals
        anchors_csf: List<String>
        anchors_pf: List<String>
        anchors_airmf: List<String>
        status_csf: String
        status_privacy: String
        status_airmf: String
        verification_method: String
      source: "control_set.yaml@control_set.controls[kind=CR] (38 controls; P2 ROOT canonical)"
      example: "CR-D-01.1-001"

    BestPracticeRule:
      attrs:
        id: String  # BPR-D-XX.Y-NNN
        subdomain_id: String
        title: String
        register: enum(BEST_PRACTICE)
        normative_intensity: Float
        bucket: enum(Priority)
        legal: List<String>
        obligations_addressed: List<String>  # derived via AG chain where related_goals is not NATIVE
        objectives_addressed: List<String>  # AG ids where related_goals is not NATIVE
        native: Boolean  # related_goals == NATIVE (best-practice not tied to a Phase-1 goal)
        anchors_csf: List<String>
        anchors_pf: List<String>
        anchors_airmf: List<String>
        verification_method: String
      source: "control_set.yaml@control_set.controls[kind=BPR] (40 controls)"
      example: "BPR-D-01.1-001"

    Tension:
      attrs:
        id: String  # TENSION-{H,M,L}-NNN (Doc16 card id, used verbatim) or T-NNN for the note-declared T-005
        alias: String  # dual id space: T-005 carries alias TENSION-M-002 (Doc16 §4.1 note); card ids keep their canonical_alias free
        title: String
        nature: enum(STRUCTURAL | CONTEXTUAL)
        severity: enum(CRITICAL | HIGH | MEDIUM | LOW)
        type: enum(TEMPORAL_CONFLICT | REQUIREMENT_CONFLICT | FREQUENCY_MISMATCH | INTENSITY_GAP)
        always_active: Boolean
        overlap_condition: String
        clause_1: String  # source regulations (condensed)
        affected_subdomains: List<String>
        affected_regulations: List<String>
        resolution_approach: String  # OPERATIONAL_PROCEDURE / DESIGN_DECISION
        resolution_description: String
      source: "Doc16 §4.1 classification table + §4.2-4.3 cards (T-001..T-004) + §4.1 note (T-005/TENSION-M-002, analysis in P1 Doc11 §4.5)"
      example: "TENSION-H-001"

    NistSubcategory:
      attrs:
        id: String  # NIST-<framework>-<subcat>
        control_id: String  # e.g. PR.DS-01 / PR.DS-P1 / GOVERN-1.6
        framework: enum(NistFramework)
        function: String  # GV/ID/PR/DE/RS/RC for CSF; PF category; AI RMF function
        description: String
        source_doc: String  # Doc20 §1 / control_set.yaml@anchors
      source: "control_set.yaml@{csf,pf,airmf} fields (pattern-validated); Doc20 §1 aggregate view"
      example: "NIST-CSF-PR.DS-01"

  enums:
    Priority: [P1_MUST, P2_SHOULD, P3_COULD]
    NistFramework: [CSF, PF, AI-RMF]
    TensionNature: [STRUCTURAL, CONTEXTUAL]
    TensionSeverity: [CRITICAL, HIGH, MEDIUM, LOW]
    TensionType: [TEMPORAL_CONFLICT, REQUIREMENT_CONFLICT, FREQUENCY_MISMATCH, INTENSITY_GAP]
    RegisterType: [OBLIGATION, BEST_PRACTICE]

  relations:

    # Phase 2 core chain: source clauses → obligations → objectives → rules
    - { verb: OBLIGATES_TO,    from: RegulatoryClause,    to: Obligation,
        cardinality: "N:N (a clause obligates one or more obligations; an obligation derives from one or more clauses)",
        source: "Doc15 canonical tables (OBL → source clause column)" }
    - { verb: GENERATES,       from: Obligation,          to: Tension,
        cardinality: "N:N (an obligation can generate one or more tensions when paired with another)",
        source: "Doc16 §4.2-4.3 cards (Obligation ID / Sub-Domain fields) + §4.1 note" }
    - { verb: YIELDS,          from: Obligation,          to: PrivacyOperationalObjective,
        cardinality: "1:N (an obligation may yield one or more POs; Doc17 §3 source-obligations column)",
        source: "Doc17 §3 (source obligations per AG row)" }
    - { verb: YIELDS,          from: Obligation,          to: SecurityOperationalObjective,
        cardinality: "1:N",
        source: "Doc17 §4 (source obligations per AG row)" }
    - { verb: MITIGATES,       from: ComplianceRule,      to: PrivacyOperationalObjective,
        cardinality: "N:N (a rule mitigates one or more objectives)",
        source: "control_set.yaml@related_goals (AG ids parsed mechanically)" }
    - { verb: MITIGATES,       from: ComplianceRule,      to: SecurityOperationalObjective,
        cardinality: "N:N",
        source: "control_set.yaml@related_goals" }
    - { verb: MITIGATES,       from: BestPracticeRule,    to: PrivacyOperationalObjective,
        cardinality: "N:N",
        source: "control_set.yaml@related_goals (BPR rows with NATIVE have no objective links — native best practice)" }
    - { verb: MITIGATES,       from: BestPracticeRule,    to: SecurityOperationalObjective,
        cardinality: "N:N",
        source: "control_set.yaml@related_goals (NATIVE BPRs excluded)" }
    - { verb: MAPS_TO,         from: ComplianceRule,      to: NistSubcategory,
        cardinality: "N:N (a rule maps to one or more NIST subcats; a subcat is cited by many rules)",
        source: "control_set.yaml@{csf,pf,airmf}; Doc20 §1" }
    - { verb: MAPS_TO,         from: BestPracticeRule,    to: NistSubcategory,
        cardinality: "N:N",
        source: "control_set.yaml@{csf,pf,airmf}; Doc20 §1" }
    - { verb: IN_TENSION_WITH, from: Tension,             to: Tension,
        cardinality: "N:0..1 (symmetric pairings per Doc16)",
        source: "Doc16 §4 (each tension pairs two or more regulations or sub-domains)",
        status: "informative" }

  invariants:
    counts:
      obligations_total: 38                # Doc15 canonical tables (38 rows)
      obligations_with_cr: 38             # all 38 addressed by ≥1 CR via the AG chain (AUD-P2-005 = 0 orphans)
      po_total: 12                         # Doc17 §3 canonical rows (12; doc's own §3.5 summary claims 11 — AUD-P2-007)
      so_total: 26                         # Doc17 §4 unique AG ids minus the 12 shared with §3 (doc's §4 summary claims 22 — AUD-P2-008)
      objectives_total: 38                 # 12 PO + 26 SO (unique AG ids in Doc17)
      compliance_rules_total: 38           # control_set.yaml@kind=CR
      best_practice_rules_total: 40        # control_set.yaml@kind=BPR
      controls_total: 78                   # 38 CR + 40 BPR (the '**' assert)
      tensions_total: 5                    # Doc16 §4.1 note: canonical set T-001..T-005 (matches phase1@case_invariants.tensions=5)
      source_clauses_total: 150            # phase1_ontology.yaml v2.1-port@case_invariants.total_clauses
      applicable_regs: 5                   # GDPR + CRA + NIS 2 + DORA + AI Act
      nist_subcategories_min: 40           # audit-only minimum (collected from anchors, not enumerated)
    id_patterns:
      obligation: "^OBL-D-[0-9]+\\.[0-9]+-[0-9]{3}$"
      privacy_objective: "^AG-D-[0-9]+\\.[0-9]+-[0-9]{3}$"
      security_objective: "^AG-D-[0-9]+\\.[0-9]+-[0-9]{3}$"
      compliance_rule: "^CR-D-[0-9]+\\.[0-9]+-[0-9]{3}$"
      best_practice_rule: "^BPR-D-[0-9]+\\.[0-9]+-[0-9]{3}$"
      tension: "^(TENSION-[HML]-[0-9]{3}|T-[0-9]{3})$"
      nist_subcategory_csf: "^NIST-CSF-[A-Z]{2}\\.[A-Z]{2}-[0-9]{2}$"
      nist_subcategory_pf: "^NIST-PF-[A-Z]{2}\\.[A-Z]{2}-[A-Z][0-9]$"

  maturity_model:
    authority: "00_METHODOLOGY/MATURITY_MODEL_CSF_STRICT.md v1.0"
    reference_framework: "NIST CSF 2.0 §3.4 Implementation Tiers (Feb 2024)"
    crosswalk_authority: "00_METHODOLOGY/PREPROCESSING_by_domain/MAPPINGS/OVERLAYS/OVERLAY_NIST_CSF_2.0.md §2"
    schema_version: 1.0
    generated: "2026-09-04"
    phase1_reference: "../01_PHASE1_CONTEXT_RICH/phase1_ontology.yaml@kg_ontology.maturity_model"
    notes: >
      Phase 2 maturity uses the same two-scale model as Phase 1 (Capability A
      per Function + Coverage B per sub-domain). Phase 2 evidence shifts from
      AdjustedGoal evidence (Phase 1) to Rule/Objective evidence (Phase 2):
      every ComplianceRule and BestPracticeRule contributes 1 Capability
      EvidenceItem and 1 Coverage EvidenceItem per addressed objective.
      Phase 1 maturity_model block (v2.1-port) is the authoritative reference;
      this block only re-asserts the schema_version and adds a phase-specific
      data-source pointer.
    scales:
      A_capability_by_function:
        scale_id: "A"
        reference: "NIST CSF 2.0 §3.4 (5 Functions + GOVERN)"
        tiers: [T1_PARTIAL, T2_RISK_INFORMED, T3_REPEATABLE, T4_ADAPTIVE]
        unit: "Score (0.0..4.0) per Function"
        notes: "Score derived from per-rule Implementation Posture Cur X/4 → Tgt Y/4 values (control_set.yaml@status)"
      B_coverage_by_subdomain:
        scale_id: "B"
        reference: "AEGIS D-XX.Y taxonomy (10 domains × 4 sub-domains = 38 subdomains; Case_03 active = 38, per phase1_ontology v2.1-port@case_invariants)"
        tiers: [NOT_ADDRESSED, PARTIAL, SUBSTANTIVE]
        unit: "Boolean + tier per active subdomain"
        notes: "Coverage derived from control_set.yaml@traceability per sub-domain"
    evidence_classes:
      CapabilityEvidence:
        attrs: { id, rule_id, function, current_posture, target_posture, evidence }
        source: "control_set.yaml@status_csf + Doc19 verification"
      CoverageEvidence:
        attrs: { id, subdomain_id, controls_count, objectives_count, evidence }
        source: "control_set.yaml + Doc17/19 cross-walk"
