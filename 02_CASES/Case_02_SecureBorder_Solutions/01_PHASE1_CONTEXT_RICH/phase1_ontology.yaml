# ============================================================
# APPLICABILITY ASSESSMENTS
# ============================================================

applicability_assessments:
  - company_id: "CC-SECUREBORDER-2026-001"
    regulation_id: "REG-GDPR"
    assessment: "applicable"
    confidence: "high"
    obligated_party: ["controller", "processor"]
    evidence:
      - "Q22: processes special category personal data (biometric facial templates, Art. 9)"
      - "Q1: EU data subjects (Schengen travelers)"
      - "Q27: large-scale processing (millions of crossings annually)"
      - "Q57: B2G contract — controller for audit logs, processor for biometric data"
    reasoning: "SecureBorder processes special category data (Art. 9 biometric facial templates) on behalf of government border control authorities. As processor, GDPR obligations apply via Art. 28 DPA. Additionally, SecureBorder is a controller for audit logs and compliance data (Art. 6(1)(c) legal basis). Large-scale Art. 9 processing triggers mandatory DPIA (Art. 35)."

  - company_id: "CC-SECUREBORDER-2026-001"
    regulation_id: "REG-CRA"
    assessment: "applicable"
    confidence: "high"
    obligated_party: "manufacturer"
    evidence:
      - "Q1: EU customers (Schengen border control authorities)"
      - "Q7: GuardianGate eGate — digital product placed on EU market"
      - "Q60: hardware+software with Edge AI — digital element present"
      - "Q70: Critical Class — border control security function"
    reasoning: "GuardianGate eGate systems are digital products with critical security functions for border control. As manufacturer, SecureBorder must comply with CRA Essential Requirements (Annex I Parts I and II). Critical Class classification requires third-party conformity assessment by a notified body (Art. 32(3) until Art. 8 certification scheme exists)."

  - company_id: "CC-SECUREBORDER-2026-001"
    regulation_id: "REG-NIS2"
    assessment: "applicable"
    confidence: "high"
    obligated_party: "essential_entity_supplier"
    evidence:
      - "Q2: 450 employees (medium enterprise, >=50 threshold)"
      - "Q3: 120M EUR revenue (medium enterprise, >=10M threshold)"
      - "Q4: Defense/Security/Critical Infrastructure sector (Annex I)"
      - "Q47: essential entity supplier (supplies government border control)"
    reasoning: "SecureBorder qualifies as a medium-sized enterprise (450 employees, 120M EUR revenue) operating in the defense/security sector. As a supplier of critical systems to government border control (essential entities), NIS 2 supply chain security obligations apply (Art. 21(2)(d)). Management liability applies for non-compliance (Art. 21(4))."

  - company_id: "CC-SECUREBORDER-2026-001"
    regulation_id: "REG-DORA"
    assessment: "not_applicable"
    confidence: "high"
    reason: "not_financial_entity"
    evidence:
      - "Q6: No regulated financial operations (not bank, insurance, payment institution, investment firm)"
      - "Q18: Products are border control, not financial services"
    reasoning: "SecureBorder is not a financial entity as defined by DORA Art. 2. Products are border control systems, not financial services. DORA does not apply."

  - company_id: "CC-SECUREBORDER-2026-001"
    regulation_id: "REG-AIAct"
    assessment: "applicable"
    confidence: "high"
    obligated_party: "provider"
    evidence:
      - "Q8: Edge AI system present (face matching, liveness detection)"
      - "Q39: Annex III §1 use case (migration, asylum, border control)"
      - "Q40: biometric categorization (facial recognition — verification, not identification)"
      - "Q41: no prohibited Art. 5 practices apply"
    reasoning: "GuardianGate uses Edge AI for automated border control (face matching, liveness detection). This falls explicitly under AI_Act Annex III §1 (migration, asylum and border control management) as a high-risk AI system. Conformity assessment required before EU market placement (Art. 43(4) — third-party assessment for Annex III). Post-market monitoring system mandatory (Art. 72)."

