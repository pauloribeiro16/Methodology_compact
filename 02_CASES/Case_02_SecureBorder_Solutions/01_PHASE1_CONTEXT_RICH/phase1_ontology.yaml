# ============================================================
# TENSIONS (Strategic conflicts between clauses)
# ============================================================

tensions:
  - id: "T-001"
    type: "timing"
    severity: "high"
    clause_1: "GDPR-C18"
    clause_2: "CRA-C14"
    description: "Breach notification timing mismatch — 72h vs 24h/14d/1m CRA flows"
    details: |
      GDPR Art. 33(1) requires 72h notification to supervisory authority.
      CRA Art. 14(1)-(2) requires 24h early warning to CSIRT/ENISA for actively
      exploited vulnerabilities, with 72h notification and 14d final report.
      CRA Art. 14(3)-(5) requires 24h/72h/1 month for severe incidents.
    affected_subdomains: ["D-04.3"]
    affected_regulations: ["GDPR", "CRA"]
    resolution:
      approach: "max_sla_routing"
      description: "Use the most stringent timeline (24h) as the internal standard for all breach notifications"
      implementation: "Single incident response workflow that satisfies both requirements"

  - id: "T-002"
    type: "timing"
    severity: "high"
    clause_1: "CRA-C14"
    clause_2: "NIS2-C24"
    description: "NIS 2 24h early warning overlaps with CRA 24h early warning"
    details: |
      NIS 2 Art. 23(4)(a) requires 24h early warning to CSIRT.
      CRA Art. 14(1) requires 24h early warning to CSIRT/ENISA.
      Both have 24h, 72h, 1 month milestones with slightly different content.
    affected_subdomains: ["D-04.3"]
    affected_regulations: ["CRA", "NIS 2"]
    resolution:
      approach: "unified_breach_workflow"
      description: "Single breach workflow that generates all required reports from one source data set"
      implementation: "Unified incident response platform with per-regulation output templates"

  - id: "T-003"
    type: "scope"
    severity: "high"
    clause_1: "GDPR-C22"
    clause_2: "AI-C20"
    description: "DPIA vs FRIA — both required for biometric border control AI"
    details: |
      GDPR Art. 35(1) requires DPIA for high-risk processing (biometric Art. 9
      mandatory under Art. 35(3)(b)).
      AI_Act Art. 27 requires Fundamental Rights Impact Assessment (FRIA) for
      high-risk AI used in public services / border control.
      Both must be performed; they can be unified into a single assessment
      process but have distinct content requirements.
    affected_subdomains: ["D-09.2"]
    affected_regulations: ["GDPR", "AI_Act"]
    resolution:
      approach: "unified_assessment"
      description: "Single integrated assessment process that satisfies both DPIA and FRIA content requirements"
      implementation: "Combined DPIA/FRIA template and review process; dual sign-off (DPO + AI Governance Lead)"

  - id: "T-004"
    type: "requirement"
    severity: "medium"
    clause_1: "CRA-C17"
    clause_2: "AI-C22"
    description: "CRA Critical Class third-party assessment vs AI_Act Annex III third-party assessment"
    details: |
      CRA Art. 32(3) requires notified body assessment for Critical Class
      products (no certification scheme yet).
      AI_Act Art. 43(4) requires third-party assessment for Annex III high-risk
      AI systems.
      Both require notified body engagement; the assessments are distinct
      processes with separate scopes (product security vs AI system quality).
    affected_subdomains: ["D-10.3"]
    affected_regulations: ["CRA", "AI_Act"]
    resolution:
      approach: "joint_notified_body_engagement"
      description: "Engage a single notified body (where possible) to perform both assessments with shared evidence"
      implementation: "Coordinated assessment timeline; shared technical documentation where scopes overlap"

  - id: "T-005"
    type: "scope"
    severity: "medium"
    clause_1: "CRA-C11"
    clause_2: "NIS2-C14"
    description: "SBOM (CRA Art. 7) vs supplier security clauses (NIS 2 Art. 21(2)(k))"
    details: |
      CRA Art. 7 requires SBOM for all software components.
      NIS 2 Art. 21(2)(k) requires security clauses in procurement contracts.
      Both target supply chain but have different deliverable formats.
    affected_subdomains: ["D-06.1", "D-06.2", "D-06.3"]
    affected_regulations: ["CRA", "NIS 2"]
    resolution:
      approach: "integrated_supplier_process"
      description: "Single supplier onboarding process that produces SBOM and contractual security clauses from shared assessment"
      implementation: "Supplier security questionnaire yields both SBOM inputs and contractual clauses"

  # ============================================================
  # TENSIONS T-006, T-007, T-008 — ADDED IN v1.1 (Sprint 1, 2026-08-06)
  # These tensions are referenced in Doc 07 §5.4 Compound Event Scenarios
  # (EVT-005, EVT-006, EVT-007, EVT-008) and PROJECT_STATE.md §3.3.
  # v1.0 only declared T-001–T-005; the lint flagged T-006/T-007/T-008 as
  # "not in ground truth ontology" — fixed by extending the ontology below.
  # ============================================================

  - id: "T-006"
    type: "requirement"
    severity: "medium"
    clause_1: "GDPR-C11"
    clause_2: "NIS2-C14"
    description: "Supplier security assessment — GDPR Art. 28 processor vs NIS 2 Art. 21(2)(k) supply chain"
    details: |
      GDPR Art. 28 requires processor selection with sufficient guarantees
      (DPA + due diligence on technical/organizational measures).
      NIS 2 Art. 21(2)(k) requires security clauses in supplier contracts
      (direct supplier relationship + supply chain assessment).
      Both target supplier security but have different deliverable formats
      and audit trails. Periodic assessment cycles diverge.
    affected_subdomains: ["D-06.1"]
    affected_regulations: ["GDPR", "NIS 2"]
    resolution:
      approach: "unified_supplier_questionnaire"
      description: "Single supplier security questionnaire that satisfies both GDPR Art. 28 and NIS 2 Art. 21(2)(k) with regulation-specific output annexes"
      implementation: "Annual supplier review cycle with single evidence pack; GDPR and NIS 2 outputs generated from shared assessment"
    added_in_version: "1.1"
    added_by: "Sprint 1 reconciliation (Case_02, 2026-08-06)"

  - id: "T-007"
    type: "requirement"
    severity: "medium"
    clause_1: "GDPR-C09"
    clause_2: "CRA-C01"
    description: "Product design phase — GDPR Art. 25 (privacy by design) vs CRA Annex I (secure by default)"
    details: |
      GDPR Art. 25 requires data protection by design and by default.
      CRA Annex I Part I requires secure by default configuration.
      Both apply at product design phase (D-07.1) but with distinct
      evidence requirements (privacy risk assessment vs threat model).
    affected_subdomains: ["D-07.1"]
    affected_regulations: ["GDPR", "CRA"]
    resolution:
      approach: "unified_sdlc"
      description: "Single SDLC process that produces both privacy-by-design and secure-by-default evidence from shared design reviews"
      implementation: "Combined DPF + threat model template; joint sign-off (DPO + CISO)"
    added_in_version: "1.1"
    added_by: "Sprint 1 reconciliation (Case_02, 2026-08-06)"

  - id: "T-008"
    type: "requirement"
    severity: "low"
    clause_1: "GDPR-C27"
    clause_2: "NIS2-C11"
    description: "Annual security awareness training — GDPR Art. 39(1)(b) vs NIS 2 Art. 21(2)(d)"
    details: |
      GDPR Art. 39(1)(b) requires DPO awareness/training of staff.
      NIS 2 Art. 21(2)(d) requires management and staff cybersecurity training.
      Both target security awareness but with different content and audience
      (DPO-focused vs all staff including management board).
    affected_subdomains: ["D-08.1"]
    affected_regulations: ["GDPR", "NIS 2"]
    resolution:
      approach: "unified_awareness_programme"
      description: "Single annual security awareness programme that satisfies both GDPR DPO training and NIS 2 management/staff training"
      implementation: "Annual cycle: 4 general sessions + 1 DPO-specific module + 1 management board module"
    added_in_version: "1.1"
    added_by: "Sprint 1 reconciliation (Case_02, 2026-08-06)"

  # ============================================================
  # TENSION T-009 — ADDED IN v1.3 (corr-Case02 Commit B, 2026-08-10)
  # F-03 fix: D-10.1 monitoring opt-out SCOPE_CONFLICT.
  # CRA Annex I (2)(l) (user opt-out) vs GDPR Art. 32(2) (continuous security
  # monitoring) vs NIS 2 Art. 21(2)(b) (appropriate-and-proportionate monitoring).
  # Resolution: layered monitoring split (analytics opt-out eligible, security-event
  # monitoring mandatory regardless of opt-out).
  # ============================================================

  - id: "T-009"
    type: "scope"
    severity: "medium"
    clause_1: "CRA-AnnexI-2l"
    clause_2: "GDPR-C32_2"
    clause_3: "NIS2-C21_2_b"
    description: "Monitoring opt-out — CRA Annex I (2)(l) vs GDPR Art. 32(2) vs NIS 2 Art. 21(2)(b)"
    details: |
      CRA Annex I Part I (2)(l) provides a user-visible opt-out mechanism for
      monitoring where appropriate. GDPR Art. 32(2) five-event risk enumeration
      assumes continuous security monitoring (no opt-out). NIS 2 Art. 21(2)(b)
      requires appropriate-and-proportionate measures including monitoring.
      Tension: User opt-out (CRA) vs continuous security obligation (GDPR + NIS 2).
    affected_subdomains: ["D-10.1"]
    affected_regulations: ["CRA", "GDPR", "NIS 2"]
    resolution:
      approach: "layered_monitoring_opt_out"
      description: "Monitoring split — (a) security-event monitoring (mandatory, no opt-out); (b) usage analytics (CRA opt-out available). Monotone split ensures opt-out does not affect security-event layer."
      implementation: "1. UI toggle for analytics; 2. Security-event monitoring channel operates regardless of opt-out; 3. DPA template documents opt-out scope; 4. Quarterly verification of monotone split"
    added_in_version: "1.3"
    added_by: "corr-Case02 Commit B Executor (Case_02, 2026-08-10)"

